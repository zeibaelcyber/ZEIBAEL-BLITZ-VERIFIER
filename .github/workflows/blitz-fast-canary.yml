name: Blitz Fast Canary Lane

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blitz-fast-canary.yml"
      - "src/warm-kernel.mjs"
      - "src/blitz-cache.mjs"
      - "services/warm-runner/**"
      - "scripts/run-real-webcontainer-warm-runner-canary.mjs"
      - "scripts/build-runtime-sentinel-request.mjs"
      - "fixtures/browser-fabric-v19.html"
      - "scripts/run-real-browser-fabric-canary.mjs"
      - "scripts/build-browser-fabric-sentinel-request.mjs"

permissions:
  contents: read
  id-token: write

jobs:
  warm-real-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Real WebContainer Warm Runner
        run: node scripts/run-real-webcontainer-warm-runner-canary.mjs
      - name: Build sentinel
        run: node scripts/build-runtime-sentinel-request.mjs
      - name: Persist strict OIDC sentinel
        shell: bash
        env:
          SENTINEL_URL: "https://pfxcdxxxcyoinlksruoy.supabase.co/functions/v1/zeibael-blitz-workspace-status"
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zeibael-blitz-sentinel")"
          OIDC_TOKEN="$(printf '%s' "${OIDC_RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(2);process.stdout.write(j.value)})')"
          curl -fsS -X POST "${SENTINEL_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H "Content-Type: application/json" --data-binary @evidence/runtime-sentinel-request.json > evidence/ingest-response.json
          node -e 'const fs=require("node:fs");const j=JSON.parse(fs.readFileSync("evidence/ingest-response.json","utf8"));if(j.ok!==true||j.accepted!==true||j.promotion_automatic!==true){console.error(j);process.exit(1)}'
      - name: Evidence
        if: always()
        run: |
          test -f evidence/warm-runner-real-webcontainer.json && cat evidence/warm-runner-real-webcontainer.json || true
          test -f evidence/ingest-response.json && cat evidence/ingest-response.json || true

  browser-real-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Real Browser Fabric
        run: node scripts/run-real-browser-fabric-canary.mjs
      - name: Build sentinel
        run: node scripts/build-browser-fabric-sentinel-request.mjs
      - name: Persist strict OIDC sentinel
        shell: bash
        env:
          SENTINEL_URL: "https://pfxcdxxxcyoinlksruoy.supabase.co/functions/v1/zeibael-blitz-workspace-status"
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zeibael-blitz-sentinel")"
          OIDC_TOKEN="$(printf '%s' "${OIDC_RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(2);process.stdout.write(j.value)})')"
          curl -fsS -X POST "${SENTINEL_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H "Content-Type: application/json" --data-binary @evidence/browser-fabric-sentinel-request.json > evidence/browser-fabric-ingest-response.json
          node -e 'const fs=require("node:fs");const j=JSON.parse(fs.readFileSync("evidence/browser-fabric-ingest-response.json","utf8"));if(j.ok!==true||j.accepted!==true||j.promotion_automatic!==true){console.error(j);process.exit(1)}'
      - name: Evidence
        if: always()
        run: |
          test -f evidence/browser-fabric-real-host.json && cat evidence/browser-fabric-real-host.json || true
          test -f evidence/browser-fabric-ingest-response.json && cat evidence/browser-fabric-ingest-response.json || true
