name: ZEIBAEL Acker Scheduler Stress

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/acker-accelerator.mjs"
      - "src/smart-packet.mjs"
      - "scripts/acker-scheduler-stress.mjs"
      - ".github/workflows/acker-scheduler-stress.yml"

permissions:
  contents: read

concurrency:
  group: zeibael-acker-scheduler-stress
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stress 4096-job event-driven scheduler
        run: node scripts/acker-scheduler-stress.mjs
