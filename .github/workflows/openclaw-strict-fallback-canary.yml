# Strict bounded fallback proof; Hermes is intentionally not part of this workflow.
name: ZEIBAEL OpenClaw Strict Fallback Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openclaw-strict-fallback-canary.yml'
      - 'scripts/openclaw-local-provider-stub.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeibael-openclaw-strict-fallback-canary
  cancel-in-progress: true

jobs:
  strict-openclaw:
    name: OpenClaw strict gateway sandbox zero-spend
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact OpenClaw and build restricted Docker sandbox
        shell: bash
        run: |
          set -euo pipefail
          npm config set allow-scripts=openclaw,@google/genai,protobufjs,tree-sitter-bash --location=user
          npm install --global openclaw@2026.6.35
          openclaw --version | tee "$RUNNER_TEMP/openclaw-version.txt"
          grep -F '2026.6.35' "$RUNNER_TEMP/openclaw-version.txt" >/dev/null
          docker build -t openclaw-sandbox:bookworm-slim - <<'DOCKERFILE'
          FROM debian:bookworm-slim
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends bash ca-certificates curl git jq python3 ripgrep && rm -rf /var/lib/apt/lists/*
          RUN useradd --create-home --shell /bin/bash sandbox
          USER sandbox
          WORKDIR /home/sandbox
          CMD ["sleep", "infinity"]
          DOCKERFILE
          docker image inspect openclaw-sandbox:bookworm-slim >/dev/null
      - name: Start local zero-spend provider stub
        shell: bash
        run: |
          set -euo pipefail
          OPENCLAW_CANARY_PORT=18766 python scripts/openclaw-local-provider-stub.py >"$RUNNER_TEMP/openclaw-stub.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/openclaw-stub.pid"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18766/v1/health >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/openclaw-stub.log"; exit 1
      - name: Write strict isolated OpenClaw policy
        shell: bash
        run: |
          set -euo pipefail
          export OPENCLAW_STATE_DIR="$RUNNER_TEMP/openclaw-state"
          mkdir -p "$OPENCLAW_STATE_DIR"
          cat >"$OPENCLAW_STATE_DIR/openclaw.json" <<'JSON'
          {"gateway":{"mode":"local","bind":"loopback"},"models":{"mode":"replace","providers":{"zeibael-local":{"baseUrl":"http://127.0.0.1:18766/v1","apiKey":"zero-spend-local-not-a-secret","api":"openai-completions","models":[{"id":"canary-model","name":"ZEIBAEL Local Canary","reasoning":false,"input":["text"],"cost":{"input":0,"output":0,"cacheRead":0,"cacheWrite":0},"contextWindow":8192,"maxTokens":256}]}}},"agents":{"defaults":{"model":{"primary":"zeibael-local/canary-model","fallbacks":[]},"sandbox":{"mode":"all","backend":"docker","scope":"session","workspaceAccess":"none","docker":{"image":"openclaw-sandbox:bookworm-slim","readOnlyRoot":true,"tmpfs":["/tmp","/var/tmp","/run"],"network":"none","capDrop":["ALL"]}}}},"tools":{"elevated":{"enabled":false},"deny":["exec","process","write","edit","apply_patch","cron","gateway","nodes","sessions_spawn","sessions_send"],"sandbox":{"tools":{"deny":["exec","process","write","edit","apply_patch","cron","gateway","nodes","sessions_spawn","sessions_send"]}}},"commands":{"restart":false}}
          JSON
          python -m json.tool "$OPENCLAW_STATE_DIR/openclaw.json" >/dev/null
      - name: Validate effective sandbox and denied escape surfaces
        shell: bash
        run: |
          set -euo pipefail
          export OPENCLAW_STATE_DIR="$RUNNER_TEMP/openclaw-state"
          openclaw sandbox explain --agent main >"$RUNNER_TEMP/sandbox-explain.txt" 2>&1
          cat "$RUNNER_TEMP/sandbox-explain.txt"
          grep -Ei 'workspaceAccess.*none|workspace access.*none' "$RUNNER_TEMP/sandbox-explain.txt" >/dev/null
          grep -Ei 'docker' "$RUNNER_TEMP/sandbox-explain.txt" >/dev/null
          grep -Ei 'mode.*all' "$RUNNER_TEMP/sandbox-explain.txt" >/dev/null
          grep -Ei 'exec|process|write|edit|apply_patch|cron|gateway|nodes' "$RUNNER_TEMP/sandbox-explain.txt" >/dev/null
      - name: Start real local Gateway and execute bounded agent turn
        shell: bash
        run: |
          set -euo pipefail
          export OPENCLAW_STATE_DIR="$RUNNER_TEMP/openclaw-state"
          export NO_PROXY=127.0.0.1,localhost
          openclaw gateway run --port 18789 >"$RUNNER_TEMP/openclaw-gateway.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/openclaw-gateway.pid"
          for i in $(seq 1 45); do if openclaw gateway status >/dev/null 2>&1; then break; fi; sleep 1; done
          openclaw gateway status | tee "$RUNNER_TEMP/gateway-status.txt"
          timeout 90s openclaw agent --agent main --message 'Return exactly ZEIBAEL_OPENCLAW_STRICT_CANARY_PASS and nothing else. Do not call tools.' --model zeibael-local/canary-model --json >"$RUNNER_TEMP/openclaw-agent.json"
          cat "$RUNNER_TEMP/openclaw-agent.json"
          grep -F 'ZEIBAEL_OPENCLAW_STRICT_CANARY_PASS' "$RUNNER_TEMP/openclaw-agent.json" >/dev/null
          grep -F 'POST /v1/chat/completions' "$RUNNER_TEMP/openclaw-stub.log" >/dev/null
          python - <<'PY'
          import json
          evidence={"status":"PASS","version":"2026.6.35","runtime":"GITHUB_ACTIONS_PUBLIC_ZERO_SPEND","gateway_runtime":True,"bounded_agent_turn":True,"docker_sandbox_policy_runtime":True,"workspaceAccess":"none","elevated_enabled":False,"mutation_runtime_scheduler_tools_denied":True,"cron_heartbeat_duplication":False,"local_stub_provider":True,"external_metered_provider_fallback":False,"production_credentials_mounted":False,"live_order_enabled":False,"scheduler_owner_changed":False,"canonical_memory_owner_changed":False,"primary_orchestrator_changed":False}
          print("ZEIBAEL_OPENCLAW_STRICT_CANARY="+json.dumps(evidence,separators=(",",":")))
          PY
      - name: Stop local runtime
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/openclaw-gateway.pid" && kill "$(cat "$RUNNER_TEMP/openclaw-gateway.pid")" 2>/dev/null || true
          test -f "$RUNNER_TEMP/openclaw-stub.pid" && kill "$(cat "$RUNNER_TEMP/openclaw-stub.pid")" 2>/dev/null || true
          tail -150 "$RUNNER_TEMP/openclaw-gateway.log" 2>/dev/null || true
          tail -100 "$RUNNER_TEMP/openclaw-stub.log" 2>/dev/null || true
