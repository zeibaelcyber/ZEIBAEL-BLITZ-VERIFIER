name: ZEIBAEL Blitz Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe ZEIBAEL health v3
        run: curl -sS https://pfxcdxxxcyoinlksruoy.supabase.co/functions/v1/zeibael-blitz-health || true
      - name: Run ZEIBAEL verifier
        run: npm test
      - name: Enforce Blitz runtime invariants
        run: node scripts/blitz-invariants.mjs
