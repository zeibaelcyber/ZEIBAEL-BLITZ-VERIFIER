name: ZEIBAEL Blitz Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeibael-blitz-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run ZEIBAEL verifier
        run: npm test
      - name: Enforce Blitz runtime invariants
        run: node scripts/blitz-invariants.mjs
