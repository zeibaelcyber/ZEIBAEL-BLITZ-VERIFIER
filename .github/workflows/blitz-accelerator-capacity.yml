name: ZEIBAEL Blitz Accelerator Capacity
# trigger: local-webcontainer-proxy-v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/blitz-accelerator-capacity.yml"
      - "scripts/blitz-accelerator-capacity.mjs"

permissions:
  contents: read

concurrency:
  group: zeibael-blitz-accelerator-capacity-v2
  cancel-in-progress: true

jobs:
  accelerator-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser harness
        run: npm install --no-save --no-package-lock @sparticuz/chromium@153.0.0 puppeteer-core@25.11.0 @webcontainer/api@1.6.4
      - name: Find exact max non-timeout accelerator slots
        run: node scripts/blitz-accelerator-capacity.mjs
