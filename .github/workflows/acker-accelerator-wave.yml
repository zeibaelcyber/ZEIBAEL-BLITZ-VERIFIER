name: ZEIBAEL Acker Accelerator Wave

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeibael-acker-accelerator-wave
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        candidate: [16,24,32,48,57,64,80,96,128,192,256,384,512,768,1024,1280,1536,1791]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CANDIDATE: ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser harness
        run: npm install --no-save --no-package-lock puppeteer@24.16.0 @webcontainer/api@1.6.4
      - name: Run accelerator probe
        run: node scripts/blitz-accelerator-probe.mjs
