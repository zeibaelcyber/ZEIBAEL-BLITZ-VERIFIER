name: ZEIBAEL Internal Advisor Kernel Proof

on:
  push:
    branches:
      - acker/internal-advisor-kernel-v1-20260919
    paths:
      - '.github/workflows/internal-advisor-kernel-proof.yml'
      - 'src/smart-packet.mjs'
      - 'src/acker-accelerator.mjs'
      - 'scripts/smart-packet-selftest.mjs'
      - 'examples/openclaw-hermes-one-shot.packet.json'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: zeibael-internal-advisor-kernel-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deterministic compiler self-test
        run: npm run smart:selftest
      - name: Exact one-shot proof
        shell: bash
        run: |
          set -euo pipefail
          npm run smart:proof | tee /tmp/zeibael-smart-proof.txt
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/zeibael-smart-proof.txt', 'utf8');
          const line = text.split(/\r?\n/).find(x => x.startsWith('ZEIBAEL_SMART_ONE_SHOT='));
          if (!line) throw new Error('sentinel_missing');
          const s = JSON.parse(line.slice('ZEIBAEL_SMART_ONE_SHOT='.length));
          const required = {
            advisor_kernel_schema: 'zeibael.blitz.internal-advisor-kernel.v1',
            advisor_kernel_mode: 'DETERMINISTIC_LOCAL',
            external_advisor_roundtrips: 0,
            external_runtime_promoted: false,
            planner_unverified_bypassed: 2,
            failed: 0,
            blocked: 0,
            dependency_graph_validated: true,
            critical_path_scheduling: true,
            live_order_enabled: false
          };
          for (const [key, expected] of Object.entries(required)) {
            if (s[key] !== expected) throw new Error(key + ':' + JSON.stringify(s[key]) + '!=' + JSON.stringify(expected));
          }
          if (!/^[a-f0-9]{64}$/.test(String(s.packet_fingerprint || ''))) throw new Error('packet_fingerprint_invalid');
          if (!(s.duplicates_removed >= 1)) throw new Error('dedupe_missing');
          if (!(s.transitive_dependency_edges_removed >= 1)) throw new Error('transitive_reduction_missing');
          console.log('ZEIBAEL_INTERNAL_ADVISOR_KERNEL_EXACT_PASS');
          NODE
