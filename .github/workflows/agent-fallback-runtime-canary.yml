name: ZEIBAEL Agent Fallback Runtime Canary

on:
  push:
    branches:
      - agent-fallback-runtime-canary-v1
      - openclaw-full-runtime-proof-v1
      - main
    paths:
      - '.github/workflows/agent-fallback-runtime-canary.yml'
      - 'scripts/hermes-local-provider-stub.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeibael-agent-fallback-runtime-canary
  cancel-in-progress: true

jobs:
  openclaw:
    name: OpenClaw fresh zero-spend runtime
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/openclaw-full-runtime-proof-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact package and runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'Number(process.versions.node.split(".")[0])')" -ge 22
          version="$(npm view openclaw@2026.6.35 version)"
          test "$version" = "2026.6.35"

          runtime_out="$(npx --yes --package=openclaw@2026.6.35 -- openclaw --version 2>&1)"
          printf '%s\n' "$runtime_out"
          printf '%s' "$runtime_out" | grep -F '2026.6.35' >/dev/null

          help_out="$(npx --yes --package=openclaw@2026.6.35 -- openclaw --help 2>&1)"
          printf '%s\n' "$help_out" | head -80
          printf '%s' "$help_out" | grep -Ei 'gateway|config|doctor|sandbox' >/dev/null

      - name: Configure locked zero-spend OpenClaw sandbox
        shell: bash
        env:
          OPENCLAW_CONFIG_PATH: ${{ runner.temp }}/openclaw/openclaw.json
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/openclaw/state
          OPENCLAW_GATEWAY_TOKEN: zeibael-public-canary-token
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OPENCLAW_CONFIG_PATH")" "$OPENCLAW_STATE_DIR"
          cat >"$OPENCLAW_CONFIG_PATH" <<'JSON'
          {
            "gateway": {
              "mode": "local",
              "port": 18789,
              "bind": "loopback",
              "auth": {
                "mode": "token",
                "token": "zeibael-public-canary-token"
              }
            },
            "browser": { "enabled": false },
            "agents": {
              "defaults": {
                "heartbeat": { "every": "0m" },
                "sandbox": {
                  "mode": "all",
                  "scope": "agent",
                  "backend": "docker",
                  "workspaceAccess": "none",
                  "docker": {
                    "image": "openclaw-sandbox:bookworm-slim",
                    "readOnlyRoot": true,
                    "tmpfs": ["/tmp", "/var/tmp", "/run"],
                    "network": "none",
                    "capDrop": ["ALL"]
                  }
                }
              }
            },
            "tools": {
              "profile": "minimal",
              "deny": [
                "exec", "process", "write", "edit", "apply_patch",
                "secrets", "cron", "automations",
                "sessions_send", "sessions_spawn", "subagents"
              ],
              "sandbox": {
                "tools": {
                  "deny": [
                    "exec", "process", "write", "edit", "apply_patch",
                    "sessions_send", "sessions_spawn", "subagents"
                  ]
                }
              },
              "elevated": { "enabled": false }
            }
          }
          JSON

          npx --yes --package=openclaw@2026.6.35 -- openclaw config validate --json | tee "$RUNNER_TEMP/openclaw-config-validate.json"
          grep -E '"ok"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/openclaw-config-validate.json" >/dev/null

          test "$(npx --yes --package=openclaw@2026.6.35 -- openclaw config get agents.defaults.sandbox.mode --json | tr -d '[:space:]')" = '"all"'
          test "$(npx --yes --package=openclaw@2026.6.35 -- openclaw config get agents.defaults.sandbox.backend --json | tr -d '[:space:]')" = '"docker"'
          test "$(npx --yes --package=openclaw@2026.6.35 -- openclaw config get agents.defaults.sandbox.workspaceAccess --json | tr -d '[:space:]')" = '"none"'
          test "$(npx --yes --package=openclaw@2026.6.35 -- openclaw config get agents.defaults.heartbeat.every --json | tr -d '[:space:]')" = '"0m"'
          test "$(npx --yes --package=openclaw@2026.6.35 -- openclaw config get tools.elevated.enabled --json | tr -d '[:space:]')" = 'false'

          deny_json="$(npx --yes --package=openclaw@2026.6.35 -- openclaw config get tools.deny --json)"
          for tool in exec process write edit apply_patch secrets cron automations sessions_send sessions_spawn subagents; do
            printf '%s' "$deny_json" | grep -F ""$tool"" >/dev/null
          done

      - name: Build and inspect Docker sandbox image
        shell: bash
        run: |
          set -euo pipefail
          docker version >/dev/null
          docker build -t openclaw-sandbox:bookworm-slim - <<'DOCKERFILE'
          FROM debian:bookworm-slim
          ENV DEBIAN_FRONTEND=noninteractive
          RUN useradd --create-home --shell /bin/bash sandbox
          USER sandbox
          WORKDIR /home/sandbox
          CMD ["sleep", "infinity"]
          DOCKERFILE
          docker image inspect openclaw-sandbox:bookworm-slim >/dev/null

      - name: Prove effective sandbox policy and live gateway
        shell: bash
        env:
          OPENCLAW_CONFIG_PATH: ${{ runner.temp }}/openclaw/openclaw.json
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/openclaw/state
          OPENCLAW_GATEWAY_TOKEN: zeibael-public-canary-token
        run: |
          set -euo pipefail

          explain="$(npx --yes --package=openclaw@2026.6.35 -- openclaw sandbox explain --agent main --json)"
          printf '%s\n' "$explain" | tee "$RUNNER_TEMP/openclaw-sandbox-explain.json"
          printf '%s' "$explain" | grep -Ei '"mode"[[:space:]]*:[[:space:]]*"all"|sandbox.*all' >/dev/null
          printf '%s' "$explain" | grep -Ei '"backend"[[:space:]]*:[[:space:]]*"docker"|docker' >/dev/null
          printf '%s' "$explain" | grep -Ei '"workspaceAccess"[[:space:]]*:[[:space:]]*"none"|workspace.*none' >/dev/null

          npx --yes --package=openclaw@2026.6.35 -- openclaw gateway run --port 18789 >"$RUNNER_TEMP/openclaw-gateway.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/openclaw-gateway.pid"

          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18789/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

          curl -fsS http://127.0.0.1:18789/healthz | tee "$RUNNER_TEMP/openclaw-healthz.txt"
          curl -fsS -H 'Authorization: Bearer zeibael-public-canary-token' http://127.0.0.1:18789/readyz | tee "$RUNNER_TEMP/openclaw-readyz.txt"

          gateway_health="$(npx --yes --package=openclaw@2026.6.35 -- openclaw gateway health --port 18789 --token zeibael-public-canary-token --json)"
          printf '%s\n' "$gateway_health" | tee "$RUNNER_TEMP/openclaw-gateway-health.json"

          python - <<'PY'
          import json
          print("ZEIBAEL_OPENCLAW_CANARY=" + json.dumps({
              "status": "PASS",
              "version": "2026.6.35",
              "runtime": "GITHUB_ACTIONS_PUBLIC_ZERO_SPEND",
              "gateway_live": True,
              "gateway_port": 18789,
              "healthz_pass": True,
              "readyz_pass": True,
              "sandbox_mode": "all",
              "sandbox_backend": "docker",
              "workspace_access": "none",
              "heartbeat_every": "0m",
              "elevated_enabled": False,
              "mutation_scheduler_tools_denied": True,
              "docker_image_verified": True,
              "provider_call": False,
              "secrets_required": False,
              "live_order_enabled": False,
              "scheduler_owner_changed": False,
              "canonical_memory_owner_changed": False
          }, separators=(",", ":")))
          PY

      - name: Stop OpenClaw gateway
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/openclaw-gateway.pid"; then
            kill "$(cat "$RUNNER_TEMP/openclaw-gateway.pid")" 2>/dev/null || true
          fi
          tail -120 "$RUNNER_TEMP/openclaw-gateway.log" 2>/dev/null || true

  hermes:
    name: Hermes fresh local-stub agent runtime
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact Hermes tag
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2026.9.11 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          python -m pip install --upgrade pip
          python -m pip install -e "$RUNNER_TEMP/hermes-agent"
          hermes --version | tee "$RUNNER_TEMP/hermes-version.txt"
          grep -E '0\.21\.2|2026\.9\.11' "$RUNNER_TEMP/hermes-version.txt" >/dev/null

      - name: Start zero-spend local OpenAI-compatible stub
        shell: bash
        run: |
          set -euo pipefail
          export HERMES_CANARY_PORT=18765
          python scripts/hermes-local-provider-stub.py >"$RUNNER_TEMP/hermes-stub.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/hermes-stub.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18765/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/hermes-stub.log"
          exit 1

      - name: Run real Hermes agent turn in pseudo-TTY
        shell: bash
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          OPENAI_BASE_URL: http://127.0.0.1:18765/v1
          OPENAI_API_KEY: zeibael-local-canary-not-a-secret
          HERMES_INFERENCE_PROVIDER: custom
          HERMES_INFERENCE_MODEL: canary-model
          NO_PROXY: 127.0.0.1,localhost
        run: |
          set -euo pipefail
          unset HERMES_YOLO_MODE || true
          unset HERMES_ACCEPT_HOOKS || true
          mkdir -p "$HERMES_HOME"
          touch "$HERMES_HOME/.no-bundled-skills"
          cat >"$HERMES_HOME/config.yaml" <<'YAML'
          model:
            default: canary-model
            provider: custom
            base_url: http://127.0.0.1:18765/v1
            api_mode: chat_completions
            api_key: no-key-required
          fallback_providers: []
          YAML

          test -z "${HERMES_YOLO_MODE:-}"
          test -z "${HERMES_ACCEPT_HOOKS:-}"
          command -v script >/dev/null

          timeout 90s script -qec 'test -t 0 && test -t 1 && hermes chat --query "Return exactly ZEIBAEL_HERMES_CANARY_PASS and nothing else." --provider custom --model canary-model --quiet --max-turns 1' "$RUNNER_TEMP/hermes-session.log"

          grep -F 'ZEIBAEL_HERMES_CANARY_PASS' "$RUNNER_TEMP/hermes-session.log" >/dev/null
          ! grep -F '⚠ YOLO' "$RUNNER_TEMP/hermes-session.log" >/dev/null

          python - <<'PY'
          import json, os
          print("ZEIBAEL_HERMES_CANARY=" + json.dumps({
              "status": "PASS",
              "version": "0.21.2",
              "source_tag": "v2026.9.11",
              "runtime": "GITHUB_ACTIONS_PUBLIC_ZERO_SPEND",
              "local_stub_provider": True,
              "pseudo_tty": True,
              "yolo_mode": False,
              "external_provider_call": False,
              "production_credentials_mounted": False,
              "live_order_enabled": False,
              "scheduler_owner_changed": False,
              "canonical_memory_owner_changed": False
          }, separators=(",", ":")))
          PY

      - name: Stop local stub
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/hermes-stub.pid"; then
            kill "$(cat "$RUNNER_TEMP/hermes-stub.pid")" 2>/dev/null || true
          fi
          tail -100 "$RUNNER_TEMP/hermes-stub.log" 2>/dev/null || true
