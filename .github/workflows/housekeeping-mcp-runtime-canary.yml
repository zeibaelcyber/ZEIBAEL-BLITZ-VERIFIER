name: Housekeeping MCP Runtime Canary

on:
  pull_request:
    paths:
      - ".github/workflows/housekeeping-mcp-runtime-canary.yml"
      - "scripts/housekeeping-mcp-runtime-canary.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install Playwright MCP and Chromium
        run: |
          npm install --no-save @playwright/mcp@0.0.81
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run bounded MCP canary
        env:
          SEMGREP_SEND_METRICS: "off"
        run: python scripts/housekeeping-mcp-runtime-canary.py
