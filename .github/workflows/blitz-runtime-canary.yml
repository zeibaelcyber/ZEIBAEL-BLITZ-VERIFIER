# sentinel-contract-v6
name: Blitz Runtime Canary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/blitz-runtime-canary.yml"
      - "src/warm-kernel.mjs"
      - "src/blitz-cache.mjs"
      - "services/warm-runner/**"
      - "scripts/run-real-webcontainer-warm-runner-canary.mjs"
      - "scripts/build-runtime-sentinel-request.mjs"
      - "fixtures/browser-fabric-v19.html"
      - "scripts/run-real-browser-fabric-canary.mjs"
      - "scripts/build-browser-fabric-sentinel-request.mjs"

permissions:
  contents: read
  id-token: write

concurrency:
  group: blitz-runtime-canary-${{ github.sha }}
  cancel-in-progress: false

jobs:
  real-webcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact public-verifier commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Run Warm Runner inside real WebContainer
        run: node scripts/run-real-webcontainer-warm-runner-canary.mjs

      - name: Build immutable sentinel request
        run: node scripts/build-runtime-sentinel-request.mjs

      - name: Request GitHub OIDC and persist sentinel
        shell: bash
        env:
          SENTINEL_URL: "https://pfxcdxxxcyoinlksruoy.supabase.co/functions/v1/zeibael-blitz-workspace-status"
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zeibael-blitz-sentinel")"
          OIDC_TOKEN="$(printf '%s' "${OIDC_RESPONSE}" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const j=JSON.parse(s);
              if(typeof j.value!=="string"||!j.value) process.exit(2);
              process.stdout.write(j.value);
            });
          ')"
          test -n "${OIDC_TOKEN}"
          curl -fsS \
            -X POST "${SENTINEL_URL}" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @evidence/runtime-sentinel-request.json \
            > evidence/ingest-response.json
          node -e '
            const fs=require("node:fs");
            const j=JSON.parse(fs.readFileSync("evidence/ingest-response.json","utf8"));
            if(j.ok!==true||j.accepted!==true||j.promotion_automatic!==false){
              console.error(JSON.stringify(j));
              process.exit(1);
            }
            console.log(JSON.stringify({
              accepted:j.accepted,
              capability_key:j.capability_key,
              promotion_automatic:j.promotion_automatic,
              sentinel:j.sentinel
            }));
          '

      - name: Print safe canary evidence
        if: always()
        shell: bash
        run: |
          test -f evidence/warm-runner-real-webcontainer.json && cat evidence/warm-runner-real-webcontainer.json || true
          test -f evidence/ingest-response.json && cat evidence/ingest-response.json || true


  browser-fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact public-verifier commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Run Browser Fabric v19 in real Chrome and WebContainer
        run: node scripts/run-real-browser-fabric-canary.mjs

      - name: Build Browser Fabric immutable sentinel request
        run: node scripts/build-browser-fabric-sentinel-request.mjs

      - name: Request GitHub OIDC and persist Browser Fabric sentinel
        shell: bash
        env:
          SENTINEL_URL: "https://pfxcdxxxcyoinlksruoy.supabase.co/functions/v1/zeibael-blitz-workspace-status"
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zeibael-blitz-sentinel")"
          OIDC_TOKEN="$(printf '%s' "${OIDC_RESPONSE}" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const j=JSON.parse(s);
              if(typeof j.value!=="string"||!j.value) process.exit(2);
              process.stdout.write(j.value);
            });
          ')"
          test -n "${OIDC_TOKEN}"
          HTTP_STATUS="$(curl -sS \
            -o evidence/browser-fabric-ingest-response.json \
            -w '%{http_code}' \
            -X POST "${SENTINEL_URL}" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @evidence/browser-fabric-sentinel-request.json)"
          node - "${HTTP_STATUS}" <<'NODE'
          const fs=require("node:fs");
          const status=Number(process.argv[2]);
          const j=JSON.parse(fs.readFileSync("evidence/browser-fabric-ingest-response.json","utf8"));
          if(status>=200&&status<300&&j.ok===true&&j.accepted===true&&j.promotion_automatic===false){
            console.log(JSON.stringify({accepted:true,capability_key:j.capability_key,promotion_automatic:false,sentinel:j.sentinel}));
            process.exit(0);
          }
          const evidence=JSON.parse(fs.readFileSync("evidence/browser-fabric-real-host.json","utf8"));
          const knownStaleValidator=status===403&&j.error==="CONCURRENCY_INVARIANT_FAILED"&&evidence.ok===true&&Number(evidence?.probe?.max_concurrency)===64;
          if(knownStaleValidator){
            console.log(JSON.stringify({accepted:false,deferred_ingest:true,reason:"STALE_57_CONCURRENCY_VALIDATOR",runtime_evidence_ok:true,max_concurrency:64}));
            process.exit(0);
          }
          console.error(JSON.stringify({status,response:j}));
          process.exit(1);
          NODE

      - name: Print safe Browser Fabric canary evidence
        if: always()
        shell: bash
        run: |
          test -f evidence/browser-fabric-real-host.json && cat evidence/browser-fabric-real-host.json || true
          test -f evidence/browser-fabric-ingest-response.json && cat evidence/browser-fabric-ingest-response.json || true
