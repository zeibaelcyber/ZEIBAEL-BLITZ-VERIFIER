name: ZEIBAEL Blitz Capability Map

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/blitz-capability-map.yml"
      - "scripts/blitz-capability-profile.mjs"
      - "config/capability-map-profiles.json"

permissions:
  contents: read

concurrency:
  group: zeibael-blitz-capability-map
  cancel-in-progress: true

jobs:
  capability-profile:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        profile: [LIGHT, IO, BUILD_TEST, CPU_HEAVY]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser harness
        run: npm install --no-save --no-package-lock puppeteer@24.16.0
      - name: Run workload-specific Blitz capacity profile
        run: node scripts/blitz-capability-profile.mjs
