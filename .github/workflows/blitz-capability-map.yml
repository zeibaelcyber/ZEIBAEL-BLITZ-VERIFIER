name: ZEIBAEL Blitz Capability Map

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/blitz-capability-profile.mjs'
      - '.github/workflows/blitz-capability-map.yml'

permissions:
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        profile: [LIGHT, IO, BUILD_TEST, CPU_HEAVY]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser harness
        run: npm install --no-save --no-package-lock puppeteer@24.16.0
      - name: Run capability profile
        run: node scripts/blitz-capability-profile.mjs
