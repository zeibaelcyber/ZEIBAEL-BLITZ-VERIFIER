name: ZEIBAEL CodeGraph MCP Canary

on:
  pull_request:
    paths:
      - ".github/workflows/codegraph-mcp-canary.yml"
      - "scripts/codegraph-canary.mcp.json"
      - "scripts/codegraph-canary.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run bounded CodeGraph MCP canary
        run: node scripts/codegraph-canary.mjs
      - name: Prove embedding model was not downloaded
        run: |
          if find "$HOME/.cache/code-graph" -name model.safetensors -print -quit 2>/dev/null | grep -q .; then
            echo "unexpected embedding model download" >&2
            exit 1
          fi
